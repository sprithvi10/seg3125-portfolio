<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon — Prithviraj Sowdermett</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0d0d;
      --accent: #47a8e8; /* light blue */
      --muted: #7a7570;
      --text: #e8e4dc;
      --border: #2a2a2a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 5px 12px;
      border-radius: 3px;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 1.25rem;
    }
    p {
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }
    a {
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      color: var(--bg);
      background: var(--accent);
      padding: 11px 26px;
      border-radius: 3px;
      text-decoration: none;
      transition: background 0.25s ease;
    }
    a:hover { background: #e87247; } /* orange hover */
  </style>
</head>
<body>
  <div class="badge">Design in Progress</div>
  <h1>Coming<br />Soon.</h1>
  <p>This case study will be live once the design is complete. Check back later in the semester!</p>
  <a href="index.html">← Back to Portfolio</a>
</body>
</html>
